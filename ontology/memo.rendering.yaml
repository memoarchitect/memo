# @memoarchitect/ontology rendering configuration
# Architecture layer colors — v12 Visual Map palette

layers:
  - id: operational
    label: Operational
    color: "#C0392B"

  - id: behavioral
    label: Behavioral
    color: "#E74C3C"

  - id: functional
    label: Functional
    color: "#E67E22"

  - id: logical
    label: Logical
    color: "#7B68EE"

  - id: software
    label: Software
    color: "#F39C12"

  - id: software-extension
    label: Software Extension (ROS)
    color: "#D4AC0D"

  - id: hardware
    label: Hardware
    color: "#95A5A6"

  - id: safety
    label: Safety
    color: "#E74C3C"

  - id: security
    label: Security
    color: "#2C3E50"

  - id: privacy
    label: Privacy
    color: "#8E44AD"

  - id: verification
    label: Verification
    color: "#2ECC71"

# Model Explorer taxonomy. This is ontology metadata: Architect receives these
# values from memo-tools and does not infer MEMO's V-model from source paths.
explorer:
  classifications:
    - { source: activities, domain: architecture, group: operational }
    - { source: context, domain: architecture, group: operational }
    # Context has concrete namespaces such as actors and use_context; retain
    # them when the Explorer receives ontology-derived kinds directly.
    - { source: actors, domain: architecture, group: operational }
    - { source: use_context, domain: architecture, group: operational }
    - { source: workflows, domain: architecture, group: operational }
    - { source: scenarios, domain: architecture, group: operational }
    - { source: use_cases, domain: architecture, group: operational }
    - { source: interaction, domain: architecture, group: operational }
    - { source: operational, domain: architecture, group: operational }
    - { source: functions, domain: architecture, group: functional }
    - { source: behavior, domain: architecture, group: functional }
    - { source: constraints, domain: architecture, group: functional }
    - { source: logical_structure, domain: architecture, group: logical }
    - { source: interfaces, domain: architecture, group: logical }
    - { source: hardware_structure, domain: architecture, group: implementation }
    # HardwareAssembly is declared in architecture/implementation/hardware.
    - { source: implementation, domain: architecture, group: implementation }
    - { source: software_structure, domain: architecture, group: implementation }
    - { source: software_runtime, domain: architecture, group: implementation }
    - { source: physical, domain: architecture, group: realization }
    - { source: deployment, domain: architecture, group: realization }
    - { source: needs, domain: assurance, group: requirements }
    - { source: requirements, domain: assurance, group: requirements }
    - { source: safety, domain: assurance, group: safety-risk }
    - { source: safety_analysis, domain: assurance, group: safety-risk }
    - { source: cybersecurity, domain: assurance, group: cybersecurity }
    - { source: human_factors, domain: assurance, group: human-factors }
    - { source: verification, domain: assurance, group: verification-validation }
    - { source: core, domain: assurance, group: evidence }
    - { source: methodology, domain: methodology, group: methodology }
