stages:
  - build
  - test
  - publish
  - docs

# sysand is distributed on PyPI (https://pypi.org/project/sysand/) — the same
# external, conformant SysML v2 / KerML tool used locally. Pin it so the
# portability gate is reproducible.
variables:
  SYSAND_VERSION: "0.0.9"
  # GitLab runs OpenSysML only: SysIDE needs a licence this runner does not have.
  MEMO_TOOLCHAIN_COMPILER: opensysml
  MEMO_TEST_COMPILER: opensysml
  MEMO_VALIDATOR: opensysml

# The build and publish jobs need three things: sysand (PyPI), Node, and the memo-tools CLI that
# `build-kpar.mjs` runs `toolchain check` through. `node:26` (bookworm) carries Node and Python; sysand goes in
# a venv because bookworm's pip refuses a system-wide install. memo-tools is cloned and built as in the `test`
# job, and found through MEMO_CLI and OPENSYSML_BINARY.
.kpar_setup: &kpar_setup
  image: node:26
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-venv git >/dev/null
    - python3 -m venv /tmp/sysand-venv
    - /tmp/sysand-venv/bin/pip install --quiet "sysand==${SYSAND_VERSION}"
    - export PATH="/tmp/sysand-venv/bin:$PATH"
    - sysand --version
    - npm install --global pnpm@9.15.0
    - git clone --depth 1 https://github.com/memoarchitect/memo-tools.git /tmp/memo-tools
    - rm -rf /tmp/memo-tools/memo
    - ln -s "$CI_PROJECT_DIR" /tmp/memo-tools/memo
    - cd /tmp/memo-tools && pnpm install --frozen-lockfile && pnpm run build
    - export MEMO_CLI="node /tmp/memo-tools/packages/tools/lib/bin/memo.js"
    - export OPENSYSML_BINARY="$(find /tmp/memo-tools/node_modules/.pnpm -path '*opensysml-sysml-grpc-linux-*/bin/sysml-grpc' | head -1)"
    - test -x "$OPENSYSML_BINARY" || { echo "sysml-grpc for this platform was not installed"; exit 1; }
    - cd "$CI_PROJECT_DIR"

# ── Portability gate ─────────────────────────────────────────────────────────
# Proves the constraint-bearing ontology parses in an external SysML v2 tool.
# scripts/build-kpar.mjs regenerates each project's .meta.json and runs the real
# `sysand build`; any external-parser error fails the pipeline, so a non-portable
# ontology can never be released. It writes the archives to output/kpar/<name>/.
build:
  stage: build
  <<: *kpar_setup
  script:
    - node scripts/build-kpar.mjs
    - mkdir -p dist
    - cp output/kpar/*/*.kpar dist/
  artifacts:
    paths:
      - dist/*.kpar
    expire_in: 30 days

# ── Published-package + validating-project gate ─────────────────────────────
# Build the current tools mirror against this ontology checkout so Phase 1 can
# exercise the real CLI without depending on a published @memoarchitect/tools.
test:
  stage: test
  image: node:26-bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git >/dev/null
    - npm install --global pnpm@9.15.0
    - git clone --depth 1 https://github.com/memoarchitect/memo-tools.git /tmp/memo-tools
    - rm -rf /tmp/memo-tools/memo
    - ln -s "$CI_PROJECT_DIR" /tmp/memo-tools/memo
    - cd /tmp/memo-tools && pnpm install --frozen-lockfile
    - pnpm run build
    - export OPENSYSML_BINARY="$(find "/tmp/memo-tools/node_modules/.pnpm" -path '*opensysml-sysml-grpc-linux-*/bin/sysml-grpc' | head -1)"
    - test -x "$OPENSYSML_BINARY" || { echo "sysml-grpc for this platform was not installed"; exit 1; }
  script:
    - cd "$CI_PROJECT_DIR"
    - pnpm run version:check
    - pnpm test
    - npm pack --dry-run
    - cp -R templates/default .phase1-template
    - grep -rl '{{name}}' .phase1-template | xargs sed -i 's/{{name}}/phase1-template/g'
    - node /tmp/memo-tools/packages/tools/lib/bin/memo.js validate .phase1-template
    - node /tmp/memo-tools/packages/tools/lib/bin/memo.js validate examples/gpca-pump
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.phase1-template"

# ── Release ──────────────────────────────────────────────────────────────────
# On a version tag (v*), rebuild the .kpar archives and upload them to this
# project's GitLab generic package registry under package `memo-sysmlv2` at the
# tag version. Installable as a sysand data dependency from the registry URL.
publish:
  stage: publish
  <<: *kpar_setup
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - apt-get install -y --no-install-recommends curl >/dev/null
    - node scripts/build-kpar.mjs
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      uploaded=0
      for kpar in output/kpar/*/*.kpar; do
        fname="$(basename "$kpar")"
        echo "Uploading $fname -> generic/memo-sysmlv2/$VERSION/$fname"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$kpar" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/memo-sysmlv2/${VERSION}/${fname}"
        uploaded=$((uploaded + 1))
      done
      test "$uploaded" -gt 0 || { echo "no .kpar was built; nothing to publish"; exit 1; }

pages:
  stage: docs
  image: python:3.12-slim
  script:
    - pip install --quiet "mkdocs==1.6.1" "mkdocs-material==9.7.6" "pymdown-extensions==10.21.3"
    - python -m mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
