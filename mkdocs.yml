site_name: MEMO Ontology
site_description: A user guide to modeling medical devices with the MEMO SysML v2 ontology
site_author: memoarchitect
repo_url: https://github.com/memoarchitect/memo
repo_name: memoarchitect/memo

theme:
  name: material
  font:
    text: Nunito
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use light mode
  features:
    # navigation.sections is deliberately absent: it renders second-level
    # groups as flat bold headers. Without it the groups collapse and expand,
    # which is what lets Tutorials, Reference, and Case Studies nest.
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/image-zoom.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: sysml
          class: sysml
          format: !!python/name:sysml_highlight.sysml_fence_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

docs_dir: docs
site_dir: site

nav:
  - Home:
      - index.md
      - Getting Started: getting-started.md
  - Explanation:
      - explanation/index.md
      - Why MEMO: why/index.md
      - What is MEMO: what/index.md
  - Reference:
      - reference/index.md
      - Modules: reference/modules.md
      - Elements by layer:
          - reference/elements/index.md
          - Core: reference/elements/core.md
          - Operational: reference/elements/operational.md
          - Functional: reference/elements/functional.md
          - Logical: reference/elements/logical.md
          - Implementation and realization: reference/elements/implementation.md
          - Clinical and products: reference/elements/clinical.md
          - Assurance: reference/elements/assurance.md
          - Views and methodology: reference/elements/views.md
      - Relationships: reference/relationships.md
      - Enumerations: reference/enumerations.md
      - Rules: reference/rules.md
      - Packaging:
          - Packages and Imports: reference/packages.md
          - Public namespaces and imports: what/namespace-map.md
          - SysML Source Reference: reference/sysml.md
          - Navigate by question: architecture/index.md
          - "The memo:: Namespace": architecture/namespace.md
          - Repository and Packaging: architecture/repository.md
  - How-to Guides:
      - how-to/index.md
      - Install MEMO:
          - how-to/install/index.md
          - With npm: how-to/install/npm.md
          - As a KerML archive: how-to/install/kpar.md
          - From a source checkout: how-to/install/source.md
      - Adopt MEMO on a project: how-to/adopt.md
      - Choose an element: modeling/elements.md
      - Write a relationship: modeling/relationships.md
      - Model views and evidence: modeling/views-evidence.md
  - Tutorials:
      - examples/index.md
      - Lessons:
          - "Your first model: temperature alarm": tutorials/first-model.md
          - Surgical workflow modelling: examples/surgical-closure-workflow.md
      - Worked examples:
          - Temperature Alarm: examples/temperature-alarm.md
          - Manual Surgical Instrument: examples/manual-surgical-instrument.md
          - Single-Use Device: examples/single-use-device.md
          - Reusable Instrument: examples/reusable-instrument.md
          - Functional, Logical, Physical: examples/functional-logical-physical.md
          - Software-Only Medical Device: examples/software-only-medical-device.md
          - Embedded Infusion Pump: examples/embedded-infusion-pump.md
          - Connected Patient Monitor: examples/connected-patient-monitor.md
          - IVD Laboratory System: examples/ivd-laboratory-system.md
          - Surgical Robot: examples/surgical-robot.md
          - Multidimensional Layers: examples/multidimensional-layers.md
          - Standard SysML Diagram Samples: examples/sysml-diagram-samples.md
  - Case Studies:
      - case-studies/index.md
      - GPCA Pump:
          - case-studies/gpca/index.md
          - Narrative Walkthrough: examples/gpca-walkthrough.md
          - Stakeholders and Concerns: case-studies/gpca/stakeholders-concerns.md
          - Viewpoints: case-studies/gpca/viewpoints.md
          - Views: case-studies/gpca/views.md
          - Correspondences: case-studies/gpca/correspondences.md
  - Contribute:
      - contributing.md
