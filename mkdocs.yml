site_name: MEMO Ontology
site_description: A user guide to modeling medical devices with the MEMO SysML v2 ontology
site_author: memoarchitect
repo_url: https://github.com/memoarchitect/memo
repo_name: memoarchitect/memo

theme:
  name: material
  font:
    text: Nunito
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/image-zoom.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: sysml
          class: sysml
          format: !!python/name:sysml_highlight.sysml_fence_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

docs_dir: docs
site_dir: site

nav:
  - Explanation:
      - Why MEMO: index.md
      - Start Small: start/mental-model.md
      - Layer Map: layers/index.md
      - Context and Use: layers/context.md
      - Workflows and Scenarios: layers/operational-world.md
      - Functions and Behavior: layers/operations-system.md
      - Requirements and Architecture: layers/requirements-architecture.md
      - Risk, Cybersecurity, and Assurance: layers/risk-assurance.md
  - Tutorials:
      - Overview: examples/index.md
      - "First Model: Temperature Alarm": tutorials/first-model.md
      - Small Models:
          - Temperature Alarm: examples/temperature-alarm.md
          - Manual Surgical Instrument: examples/manual-surgical-instrument.md
          - Single-Use Device: examples/single-use-device.md
          - Standard SysML Diagram Samples: examples/sysml-diagram-samples.md
      - Building the Model:
          - Surgical Workflow Modelling: examples/surgical-closure-workflow.md
          - Reusable Instrument: examples/reusable-instrument.md
          - Functional, Logical, Physical: examples/functional-logical-physical.md
          - Software-Only Medical Device: examples/software-only-medical-device.md
          - Medical Products and Identity: layers/medical-products.md
      - Complete Systems:
          - Embedded Infusion Pump: examples/embedded-infusion-pump.md
          - Connected Patient Monitor: examples/connected-patient-monitor.md
          - IVD Laboratory System: examples/ivd-laboratory-system.md
          - Surgical Robot: examples/surgical-robot.md
      - Further Tutorials:
          - Multidimensional Layers: examples/multidimensional-layers.md
  - How-to Guides:
      - Overview: how-to/index.md
      - Set up MEMO in a model: tutorials/setup.md
  - Contribute:
      - Contributing: contributing.md
  - Reference:
      - Packages and Imports: reference/packages.md
      - SysML Source Reference: reference/sysml.md
      - Elements: modeling/elements.md
      - Relationships: modeling/relationships.md
      - Views and Evidence: modeling/views-evidence.md
      - Architecture Overview: architecture/index.md
      - "The memo:: Namespace": architecture/namespace.md
      - Repository and Packaging: architecture/repository.md
  - GPCA:
      - GPCA Pump: examples/gpca-walkthrough.md
