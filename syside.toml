#:schema https://docs.sensmetry.com/schemas/latest/syside.schema.json

# When this nested repository is opened directly in VS Code, its `.git` file is
# a SysIDE root marker. Include the canonical source tree explicitly so its
# namespace-aligned source modules and the memo:: facade resolve as one model.
include = [
    "src",
    # Extensions are ontology, not examples: reusable packages that specialize
    # the base and are selected by a methodology or a project binding. They
    # resolve against `src`, so the editor has to see both as one model.
    "extensions",
]

exclude = [
    "node_modules",
    "packages",
    "output",
    ".sysand",
]
