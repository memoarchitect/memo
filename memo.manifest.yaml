manifest: 1
packages:
  "@memoarchitect/ontology": ./ontology
  "@memoarchitect/medical-modeling-profile": ./profile
  "@memoarchitect/methodology-default": ./methodologies/default
  "@memoarchitect/methodology-gpca": ./methodologies/gpca
init:
  defaultExtends: "@memoarchitect/methodology-default"
  rootImport: "memo"
  defaultTemplate: default
templates:
  default: ./templates/default
  samd: ./templates/samd
  connected-device: ./templates/connected-device
  monitoring-device: ./templates/monitoring-device
  infusion-pump: ./templates/infusion-pump
examples:
  gpca: ./examples/gpca-pump
  standard-sysml-diagrams: ./examples/sysml-diagram-samples
  ui-screen-regions: ./examples/ui-screen-regions
  nested-architecture-dsm: ./examples/nested-architecture-dsm
  ros-mobile-robot: ./examples/ros-mobile-robot
# Extensions are a way to MODEL, not a thing to copy. They are reusable
# ontology packages that specialize the base, selected by a methodology or a
# project binding — so they sit beside the ontology, not under examples/.
# `examples/ros-mobile-robot` demonstrates using one; it is not the extension.
extensions:
  template: ./extensions/template
  clinical: ./extensions/clinical
  aadl: ./extensions/aadl
  cloud: ./extensions/cloud
  container: ./extensions/container
  messaging: ./extensions/messaging
  ros: ./extensions/ros
