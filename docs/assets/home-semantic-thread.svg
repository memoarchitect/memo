<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">A typed safety thread makes the claim explicit</title>
  <desc id="desc">The overdose hazard is the source for a lockout requirement, which is satisfied by the infusion manager. A lockout control mitigates the hazard, is implemented by the infusion manager, is checked by a verification case, and produces evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#168c72"/>
    </marker>
  </defs>
  <rect width="1120" height="420" rx="18" fill="#f3fbf8"/>
  <g font-family="system-ui, sans-serif">
    <text x="42" y="42" font-size="17" font-weight="700" fill="#176458">THE MODEL RECORDS THE CLAIM</text>
    <text x="1078" y="42" text-anchor="end" font-size="16" fill="#4d6863">change follows relationship meaning and stable IDs</text>

    <rect x="42" y="76" width="240" height="100" rx="12" fill="#ffffff" stroke="#2dd4a8" stroke-width="2"/>
    <text x="62" y="106" font-size="14" font-weight="700" fill="#168c72">HAZARD</text>
    <text x="62" y="135" font-size="21" font-weight="700" fill="#082744">HZ-001</text>
    <text x="62" y="160" font-size="16" fill="#5c7188">Overdose</text>

    <rect x="440" y="76" width="240" height="100" rx="12" fill="#ffffff" stroke="#2dd4a8" stroke-width="2"/>
    <text x="460" y="106" font-size="14" font-weight="700" fill="#168c72">REQUIREMENT</text>
    <text x="460" y="135" font-size="21" font-weight="700" fill="#082744">REQ-025</text>
    <text x="460" y="160" font-size="16" fill="#5c7188">Lockout rule</text>

    <rect x="838" y="76" width="240" height="100" rx="12" fill="#ffffff" stroke="#2dd4a8" stroke-width="2"/>
    <text x="858" y="106" font-size="14" font-weight="700" fill="#168c72">SOFTWARE COMPONENT</text>
    <text x="858" y="135" font-size="21" font-weight="700" fill="#082744">SW-005</text>
    <text x="858" y="160" font-size="16" fill="#5c7188">Infusion manager</text>

    <path d="M292 126 H430" stroke="#168c72" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M690 126 H828" stroke="#168c72" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="361" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#168c72">DerivesFrom</text>
    <text x="759" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#168c72">SatisfiedBy</text>

    <rect x="42" y="270" width="240" height="100" rx="12" fill="#ffffff" stroke="#2dd4a8" stroke-width="2"/>
    <text x="62" y="300" font-size="14" font-weight="700" fill="#168c72">RISK CONTROL</text>
    <text x="62" y="329" font-size="21" font-weight="700" fill="#082744">RC-001</text>
    <text x="62" y="354" font-size="16" fill="#5c7188">Lockout</text>

    <rect x="440" y="270" width="240" height="100" rx="12" fill="#ffffff" stroke="#2dd4a8" stroke-width="2"/>
    <text x="460" y="300" font-size="14" font-weight="700" fill="#168c72">VERIFICATION CASE</text>
    <text x="460" y="329" font-size="21" font-weight="700" fill="#082744">VER-002</text>
    <text x="460" y="354" font-size="16" fill="#5c7188">Check lockout</text>

    <rect x="838" y="270" width="240" height="100" rx="12" fill="#ffffff" stroke="#2dd4a8" stroke-width="2"/>
    <text x="858" y="300" font-size="14" font-weight="700" fill="#168c72">EVIDENCE</text>
    <text x="858" y="329" font-size="21" font-weight="700" fill="#082744">EVD-001</text>
    <text x="858" y="354" font-size="16" fill="#5c7188">Versioned test result</text>

    <path d="M162 260 V186" stroke="#168c72" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M292 320 H430" stroke="#168c72" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M690 320 H828" stroke="#168c72" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M282 286 H320 V214 H958 V186" fill="none" stroke="#168c72" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="178" y="224" font-size="14" font-weight="700" fill="#168c72">Mitigates</text>
    <text x="361" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#168c72">VerifiedBy</text>
    <text x="759" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#168c72">ProducesEvidence</text>
    <rect x="551" y="198" width="178" height="24" rx="12" fill="#f3fbf8"/>
    <text x="640" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#168c72">ControlImplementedBy</text>
  </g>
</svg>
