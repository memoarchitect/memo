<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">Temperature alarm requirement argument</title>
  <desc id="desc">A clinical need derives a system requirement. The Evaluate Temperature system function satisfies the requirement and is checked by a verification case. An independent alarm check mitigates a missed-temperature hazard and is implemented by the function.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker></defs>
  <rect width="1100" height="330" rx="24" fill="#f7fbfd"/>
  <text x="44" y="49" font-family="Nunito,Arial,sans-serif" font-size="18" font-weight="800" fill="#082744">MODEL SLICE · FUNCTION-ANCHORED TRACEABILITY</text>
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="44" y="105" width="193" height="94" rx="14" fill="#f0edff" stroke="#8971dc"/><text x="61" y="136" font-size="11.5" font-weight="800" fill="#4c3a98">CLINICAL NEED · NEED-001</text><text x="61" y="164" font-size="16" font-weight="800" fill="#4c3a98">Maintain safe temperature</text><text x="61" y="185" font-size="12" fill="#5c7188">for the monitored patient</text>
    <rect x="323" y="105" width="214" height="94" rx="14" fill="#eaf4fd" stroke="#438ed0"/><text x="340" y="136" font-size="11.5" font-weight="800" fill="#17557f">SYSTEM REQUIREMENT · REQ-001</text><text x="340" y="164" font-size="16" font-weight="800" fill="#17557f">Alarm above limit</text><text x="340" y="185" font-size="12" fill="#5c7188">event-driven EARS statement</text>
    <rect x="623" y="105" width="190" height="94" rx="14" fill="#fff3e8" stroke="#ef9b51"/><text x="640" y="136" font-size="11.5" font-weight="800" fill="#88501f">SYSTEM FUNCTION · LF-001</text><text x="640" y="164" font-size="16" font-weight="800" fill="#88501f">Evaluate temperature</text><text x="640" y="185" font-size="12" fill="#5c7188">functional response</text>
    <rect x="866" y="105" width="190" height="94" rx="14" fill="#e3faf3" stroke="#2dd4a8"/><text x="883" y="136" font-size="11.5" font-weight="800" fill="#07604f">VERIFICATION · VER-001</text><text x="883" y="164" font-size="16" font-weight="800" fill="#07604f">Alarm test</text><text x="883" y="185" font-size="12" fill="#5c7188">checks the function</text>
    <rect x="260" y="238" width="180" height="57" rx="12" fill="#fff0ef" stroke="#e05d6f"/><text x="277" y="260" font-size="11.5" font-weight="800" fill="#94423d">HAZARD · HAZ-001</text><text x="277" y="280" font-size="12.5" font-weight="800" fill="#94423d">Missed high temperature</text>
    <rect x="540" y="238" width="210" height="57" rx="12" fill="#e4faf7" stroke="#2dd4a8"/><text x="557" y="260" font-size="11.5" font-weight="800" fill="#07604f">RISK CONTROL · RC-001</text><text x="557" y="280" font-size="12.5" font-weight="800" fill="#07604f">Independent alarm check</text>
  </g>
  <g stroke="#5c7188" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M237 152H319"/><path d="M537 152H619"/><path d="M813 152H862"/><path d="M538 266H444"/><path d="M700 236V203"/></g>
  <g font-family="JetBrains Mono,monospace" font-size="11" fill="#5c7188"><text x="257" y="141">DerivesFrom</text><text x="558" y="141">SatisfiedBy</text><text x="820" y="141">VerifiedBy</text><text x="458" y="253">Mitigates</text><text x="736" y="222">ControlImplementedBy</text></g>
</svg>
