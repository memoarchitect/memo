<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Generic traceability survives a design change</title>
  <desc id="desc">A hazard, requirement, and test remain connected by generic related-to links even though the lockout value changed from six to ten minutes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8d6670"/>
    </marker>
  </defs>
  <rect width="960" height="230" rx="18" fill="#fff8f7"/>
  <text x="42" y="42" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#7a2537">EVERY LINK STILL RESOLVES</text>
  <text x="918" y="42" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" fill="#6b5960">but the design now says 10 minutes</text>

  <g font-family="system-ui, sans-serif">
    <rect x="42" y="72" width="220" height="105" rx="12" fill="#ffffff" stroke="#d78b99" stroke-width="2"/>
    <text x="62" y="103" font-size="14" font-weight="700" fill="#8d3043">RISK</text>
    <text x="62" y="132" font-size="21" font-weight="700" fill="#2d2530">HZ-001</text>
    <text x="62" y="158" font-size="16" fill="#5e5157">Overdose</text>

    <rect x="370" y="72" width="220" height="105" rx="12" fill="#ffffff" stroke="#d78b99" stroke-width="2"/>
    <text x="390" y="103" font-size="14" font-weight="700" fill="#8d3043">REQUIREMENT</text>
    <text x="390" y="132" font-size="21" font-weight="700" fill="#2d2530">REQ-025</text>
    <text x="390" y="158" font-size="16" fill="#5e5157">6-minute lockout</text>

    <rect x="698" y="72" width="220" height="105" rx="12" fill="#ffffff" stroke="#d78b99" stroke-width="2"/>
    <text x="718" y="103" font-size="14" font-weight="700" fill="#8d3043">TEST</text>
    <text x="718" y="132" font-size="21" font-weight="700" fill="#2d2530">TC-221</text>
    <text x="718" y="158" font-size="16" fill="#5e5157">6-minute boundary</text>

    <path d="M270 124 H360" stroke="#8d6670" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <path d="M598 124 H688" stroke="#8d6670" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="315" y="110" text-anchor="middle" font-size="14" fill="#745c64">related to</text>
    <text x="643" y="110" text-anchor="middle" font-size="14" fill="#745c64">related to</text>
  </g>
</svg>
