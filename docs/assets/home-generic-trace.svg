<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">A linked verification case covers one of two bolus-request paths</title>
  <desc id="desc">The physical button and touchscreen are alternate paths to the bolus handler. The linked passing verification case exercises the button path but does not exercise the touchscreen path.</desc>
  <defs>
    <marker id="arrow-trace" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8d6670"/>
    </marker>
    <marker id="arrow-model" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#168f7b"/>
    </marker>
    <marker id="arrow-gap" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d96b17"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="18" fill="#fff"/>

  <g font-family="system-ui, sans-serif">
    <text x="38" y="38" font-size="17" font-weight="700" fill="#7a2537">TRACEABILITY REPORT</text>
    <text x="922" y="38" text-anchor="end" font-size="15" fill="#6b5960">requirement covered · test passed</text>

    <rect x="38" y="58" width="330" height="82" rx="12" fill="#fff8f7" stroke="#d78b99" stroke-width="2"/>
    <text x="58" y="85" font-size="13" font-weight="700" fill="#8d3043">SAFETY REQUIREMENT · SW-REQ-104</text>
    <text x="58" y="113" font-size="16" font-weight="650" fill="#2d2530">Reject every bolus request</text>
    <text x="58" y="132" font-size="13" fill="#5e5157">while lockout is active</text>

    <path d="M378 99 H454" stroke="#8d6670" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-trace)"/>
    <text x="416" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#745c64">VerifiedBy</text>

    <rect x="464" y="58" width="274" height="82" rx="12" fill="#fff8f7" stroke="#d78b99" stroke-width="2"/>
    <text x="484" y="85" font-size="13" font-weight="700" fill="#8d3043">VERIFICATION CASE · TC-221</text>
    <text x="484" y="113" font-size="16" font-weight="650" fill="#2d2530">Exercise physical button</text>
    <text x="484" y="132" font-size="13" fill="#5e5157">during lockout</text>

    <path d="M748 99 H794" stroke="#8d6670" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-trace)"/>
    <text x="771" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#745c64">ProducesEvidence</text>

    <rect x="804" y="58" width="118" height="82" rx="12" fill="#fff8f7" stroke="#d78b99" stroke-width="2"/>
    <text x="824" y="85" font-size="13" font-weight="700" fill="#8d3043">EVIDENCE</text>
    <text x="824" y="116" font-size="18" font-weight="700" fill="#2d2530">PASS</text>

    <line x1="38" y1="168" x2="922" y2="168" stroke="#d5e2e9" stroke-width="1.5"/>
    <text x="38" y="200" font-size="17" font-weight="700" fill="#0f6f62">CURRENT ARCHITECTURE</text>
    <text x="922" y="200" text-anchor="end" font-size="15" fill="#4a6570">two paths implement the same requirement</text>

    <rect x="38" y="222" width="218" height="66" rx="12" fill="#e7f7f4" stroke="#62c7b8" stroke-width="2"/>
    <text x="58" y="249" font-size="13" font-weight="700" fill="#0f7f6d">PHYSICAL BUTTON</text>
    <text x="58" y="273" font-size="14" font-weight="650" fill="#173244">exercised by TC-221</text>

    <path d="M266 255 H658" stroke="#168f7b" stroke-width="3" marker-end="url(#arrow-model)"/>
    <rect x="364" y="235" width="176" height="30" rx="15" fill="#e5f7f3" stroke="#9ad8ce"/>
    <text x="452" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#0f7f6d">TESTED PATH</text>

    <rect x="38" y="315" width="218" height="66" rx="12" fill="#fff0e3" stroke="#ef9a4a" stroke-width="2"/>
    <text x="58" y="342" font-size="13" font-weight="700" fill="#b65a18">TOUCHSCREEN</text>
    <text x="58" y="366" font-size="14" font-weight="650" fill="#173244">new alternate input</text>

    <path d="M266 348 H330" stroke="#d96b17" stroke-width="3" marker-end="url(#arrow-gap)"/>

    <rect x="340" y="315" width="218" height="66" rx="12" fill="#fff0e3" stroke="#ef9a4a" stroke-width="2"/>
    <text x="360" y="342" font-size="13" font-weight="700" fill="#b65a18">NEW EVENT ADAPTER</text>
    <text x="360" y="366" font-size="14" font-weight="650" fill="#173244">not exercised by TC-221</text>

    <path d="M568 348 H658" fill="none" stroke="#d96b17" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gap)"/>

    <rect x="660" y="214" width="250" height="181" rx="14" fill="#e7f7f4" stroke="#62c7b8" stroke-width="2"/>
    <text x="682" y="247" font-size="13" font-weight="700" fill="#0f7f6d">BOLUS-REQUEST HANDLER</text>
    <text x="682" y="281" font-size="16" font-weight="650" fill="#173244">Reject request during</text>
    <text x="682" y="303" font-size="16" font-weight="650" fill="#173244">active lockout</text>
    <text x="682" y="365" font-size="13" font-weight="700" fill="#b65a18">alternate path unverified</text>

    <text x="38" y="414" font-size="14" font-weight="650" fill="#173244">One linked test does not establish coverage of every architecture path.</text>
  </g>
</svg>
