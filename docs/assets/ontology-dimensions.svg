<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="odtitle oddesc">
  <title id="odtitle">One element, four orthogonal dimensions</title>
  <desc id="oddesc">A single software component participates in the architecture perspective, realization stage, engineering discipline, and cross-cutting concern dimensions at the same time, without being duplicated.</desc>
  <defs><marker id="odarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker></defs>
  <rect width="1160" height="560" rx="24" fill="#fbfcfd"/>

  <text x="48" y="52" font-family="Nunito,Arial,sans-serif" font-size="20" font-weight="850" fill="#082744">ONE ELEMENT, FOUR ORTHOGONAL DIMENSIONS</text>
  <text x="48" y="79" font-family="Nunito,Arial,sans-serif" font-size="14" fill="#5c7188">Classification is data on the element — never a copy of the element per layer, discipline, or lifecycle stage.</text>

  <!-- center element card -->
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle">
    <rect x="430" y="240" width="300" height="110" rx="16" fill="#0b1e2d"/>
    <text x="580" y="274" font-size="12" font-weight="800" fill="#2dd4a8">SoftwareComponent</text>
    <text x="580" y="300" font-size="18" font-weight="850" fill="#ffffff">DoseLimitChecker</text>
    <text x="580" y="326" font-size="11.5" fill="#9fb4c6">one model element · one identity</text>
  </g>

  <!-- perspective panel (top-left) -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="60" y="120" width="300" height="150" rx="14" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/>
    <text x="82" y="150" font-size="12.5" font-weight="850" fill="#17557f">ARCHITECTURE PERSPECTIVE</text>
    <text x="82" y="170" font-size="11" fill="#5c7188">which kind of question it answers</text>
    <g font-size="12" font-weight="750">
      <rect x="82" y="186" width="94" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="129" y="204" fill="#5c7188" text-anchor="middle">operational</text>
      <rect x="184" y="186" width="86" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="227" y="204" fill="#5c7188" text-anchor="middle">functional</text>
      <rect x="82" y="220" width="70" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="117" y="238" fill="#5c7188" text-anchor="middle">logical</text>
      <rect x="160" y="220" width="132" height="26" rx="13" fill="#438ed0"/><text x="226" y="238" fill="#ffffff" text-anchor="middle">implementation ✓</text>
    </g>
  </g>

  <!-- stage panel (top-right) -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="800" y="120" width="300" height="150" rx="14" fill="#eef4f7" stroke="#5c7188" stroke-width="2"/>
    <text x="822" y="150" font-size="12.5" font-weight="850" fill="#082744">REALIZATION STAGE</text>
    <text x="822" y="170" font-size="11" fill="#5c7188">where this identity is in its life</text>
    <g font-size="11.5" font-weight="750">
      <rect x="822" y="188" width="80" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="862" y="206" fill="#5c7188" text-anchor="middle">specified</text>
      <rect x="910" y="188" width="94" height="26" rx="13" fill="#5c7188"/><text x="957" y="206" fill="#ffffff" text-anchor="middle">designed ✓</text>
      <rect x="1012" y="188" width="52" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="1038" y="206" fill="#5c7188" text-anchor="middle">built</text>
      <rect x="822" y="222" width="80" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="862" y="240" fill="#5c7188" text-anchor="middle">deployed</text>
      <rect x="910" y="222" width="80" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="950" y="240" fill="#5c7188" text-anchor="middle">operated</text>
      <rect x="998" y="222" width="66" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="1031" y="240" fill="#5c7188" text-anchor="middle">retired</text>
    </g>
  </g>

  <!-- disciplines panel (bottom-left) -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="60" y="330" width="300" height="150" rx="14" fill="#fff0ef" stroke="#ea6b61" stroke-width="2"/>
    <text x="82" y="360" font-size="12.5" font-weight="850" fill="#94423d">ENGINEERING DISCIPLINES</text>
    <text x="82" y="380" font-size="11" fill="#5c7188">who claims it without owning it</text>
    <g font-size="12" font-weight="750">
      <rect x="82" y="396" width="76" height="26" rx="13" fill="#ea6b61"/><text x="120" y="414" fill="#ffffff" text-anchor="middle">safety ✓</text>
      <rect x="166" y="396" width="128" height="26" rx="13" fill="#8971dc"/><text x="230" y="414" fill="#ffffff" text-anchor="middle">cybersecurity ✓</text>
      <rect x="82" y="430" width="112" height="26" rx="13" fill="#0a8d76"/><text x="138" y="448" fill="#ffffff" text-anchor="middle">verification ✓</text>
      <rect x="202" y="430" width="110" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="257" y="448" fill="#5c7188" text-anchor="middle">humanFactors</text>
    </g>
  </g>

  <!-- cross-cutting panel (bottom-right) -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="800" y="330" width="300" height="150" rx="14" fill="#e3faf3" stroke="#2dd4a8" stroke-width="2"/>
    <text x="822" y="360" font-size="12.5" font-weight="850" fill="#07604f">CROSS-CUTTING CONCERNS</text>
    <text x="822" y="380" font-size="11" fill="#5c7188">obligations that follow it everywhere</text>
    <g font-size="12" font-weight="750">
      <rect x="822" y="396" width="106" height="26" rx="13" fill="#0a8d76"/><text x="875" y="414" fill="#ffffff" text-anchor="middle">traceability ✓</text>
      <rect x="936" y="396" width="94" height="26" rx="13" fill="#0a8d76"/><text x="983" y="414" fill="#ffffff" text-anchor="middle">evidence ✓</text>
      <rect x="822" y="430" width="118" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="881" y="448" fill="#5c7188" text-anchor="middle">changeControl</text>
      <rect x="948" y="430" width="116" height="26" rx="13" fill="#ffffff" stroke="#d8e2e9"/><text x="1006" y="448" fill="#5c7188" text-anchor="middle">regCompliance</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#5c7188" stroke-width="2" fill="none" marker-end="url(#odarrow)">
    <path d="M362 226 C 400 246 415 256 428 266"/>
    <path d="M798 226 C 760 246 745 256 732 266"/>
    <path d="M362 356 C 400 340 415 334 428 328"/>
    <path d="M798 356 C 760 340 745 334 732 328"/>
  </g>

  <text x="580" y="530" font-family="Nunito,Arial,sans-serif" font-size="13" font-weight="750" fill="#5c7188" text-anchor="middle">Views filter on dimension values — the element itself is never duplicated per view or discipline (ADR-0001).</text>
</svg>
