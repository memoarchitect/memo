<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
  <title id="title">Representative typed relationships in MEMO</title>
  <desc id="desc">Four rows show operational, architecture, assurance, and product relationship pairs. Every arrow uses the relationship direction and element types declared by the ontology.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#082744" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1240" height="650" rx="24" fill="#fbfcfd"/>
  <g font-family="Nunito,Arial,sans-serif">
    <text x="42" y="48" font-size="20" font-weight="850" fill="#082744">REPRESENTATIVE TYPED RELATIONSHIPS</text>
    <text x="42" y="74" font-size="14" fill="#5c7188">Each pair shows the relationship name, declared direction, and accepted MEMO element types.</text>

    <g font-size="12" font-weight="850">
      <rect x="30" y="100" width="1180" height="112" rx="16" fill="#f7f4ff" stroke="#d9d0fa"/>
      <text x="50" y="126" fill="#4c3a98">OPERATIONAL</text>
      <rect x="30" y="226" width="1180" height="112" rx="16" fill="#eff7fd" stroke="#cfe3f5"/>
      <text x="50" y="252" fill="#17557f">ARCHITECTURE</text>
      <rect x="30" y="352" width="1180" height="112" rx="16" fill="#f1fbf8" stroke="#c9eee5"/>
      <text x="50" y="378" fill="#07604f">ASSURANCE</text>
      <rect x="30" y="478" width="1180" height="112" rx="16" fill="#fff8f1" stroke="#f4d8bc"/>
      <text x="50" y="504" fill="#88501f">PRODUCT AND USE</text>
    </g>

    <g font-size="12.5" font-weight="800" text-anchor="middle" filter="url(#shadow)">
      <!-- Operational pairs -->
      <rect x="70" y="142" width="130" height="46" rx="10" fill="#fff" stroke="#8971dc"/><text x="135" y="170" fill="#4c3a98">Need</text>
      <rect x="270" y="142" width="130" height="46" rx="10" fill="#fff" stroke="#8971dc"/><text x="335" y="170" fill="#4c3a98">UseCase</text>
      <rect x="465" y="142" width="155" height="46" rx="10" fill="#fff" stroke="#8971dc"/><text x="542" y="170" fill="#4c3a98">OperationalWorkflow</text>
      <rect x="690" y="142" width="130" height="46" rx="10" fill="#fff" stroke="#8971dc"/><text x="755" y="170" fill="#4c3a98">UseCase</text>
      <rect x="875" y="142" width="155" height="46" rx="10" fill="#fff" stroke="#8971dc"/><text x="952" y="170" fill="#4c3a98">OperativeScenario</text>
      <rect x="1080" y="142" width="105" height="46" rx="10" fill="#fff" stroke="#8971dc"/><text x="1132" y="170" fill="#4c3a98">WorkflowStep</text>

      <!-- Architecture pairs -->
      <rect x="70" y="268" width="140" height="46" rx="10" fill="#fff" stroke="#438ed0"/><text x="140" y="296" fill="#17557f">FunctionalFlow</text>
      <rect x="280" y="268" width="140" height="46" rx="10" fill="#fff" stroke="#438ed0"/><text x="350" y="296" fill="#17557f">SystemFunction</text>
      <rect x="465" y="268" width="140" height="46" rx="10" fill="#fff" stroke="#438ed0"/><text x="535" y="296" fill="#17557f">SystemFunction</text>
      <rect x="675" y="268" width="145" height="46" rx="10" fill="#fff" stroke="#2dd4a8"/><text x="747" y="296" fill="#07604f">LogicalComponent</text>
      <rect x="875" y="268" width="130" height="46" rx="10" fill="#fff" stroke="#ef9b51"/><text x="940" y="296" fill="#88501f">SoftwareComponent</text>
      <rect x="1065" y="268" width="130" height="46" rx="10" fill="#fff" stroke="#2dd4a8"/><text x="1130" y="296" fill="#07604f">LogicalComponent</text>

      <!-- Assurance pairs -->
      <rect x="70" y="394" width="130" height="46" rx="10" fill="#fff" stroke="#438ed0"/><text x="135" y="422" fill="#17557f">Requirement</text>
      <rect x="270" y="394" width="140" height="46" rx="10" fill="#fff" stroke="#438ed0"/><text x="340" y="422" fill="#17557f">SystemFunction</text>
      <rect x="465" y="394" width="155" height="46" rx="10" fill="#fff" stroke="#2dd4a8"/><text x="542" y="422" fill="#07604f">RiskControlMeasure</text>
      <rect x="690" y="394" width="120" height="46" rx="10" fill="#fff" stroke="#e05d6f"/><text x="750" y="422" fill="#94423d">Hazard</text>
      <rect x="875" y="394" width="145" height="46" rx="10" fill="#fff" stroke="#2dd4a8"/><text x="947" y="422" fill="#07604f">VerificationCase</text>
      <rect x="1080" y="394" width="105" height="46" rx="10" fill="#0b1e2d"/><text x="1132" y="422" fill="#2dd4a8">Evidence</text>

    </g>

    <g stroke="#5c7188" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <path d="M204 165H266"/><path d="M624 165H686"/><path d="M1034 165H1076"/>
      <path d="M214 291H276"/><path d="M609 291H671"/><path d="M1009 291H1061"/>
      <path d="M204 417H266"/><path d="M624 417H686"/><path d="M1024 417H1076"/>
    </g>
    <g font-family="JetBrains Mono,monospace" font-size="10.5" font-weight="700" fill="#5c7188" text-anchor="middle">
      <text x="235" y="137">Motivates</text><text x="655" y="137">Supports</text><text x="1055" y="137">Selects</text>
      <text x="245" y="263">InvolvesFunction</text><text x="640" y="263">AllocatedTo</text><text x="1035" y="263">Realizes</text>
      <text x="235" y="389">SatisfiedBy</text><text x="655" y="389">Mitigates</text><text x="1050" y="389">ProducesEvidence</text>
    </g>

    <text x="50" y="622" font-size="12.5" font-weight="750" fill="#5c7188">Use the generated relationship reference for exact endpoint roles, attributes, and specializations.</text>
  </g>
</svg>
