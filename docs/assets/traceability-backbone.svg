<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="tbtitle tbdesc">
  <title id="tbtitle">The cross-layer traceability backbone</title>
  <desc id="tbdesc">From medical use case through workflow, scenario, activity, function, flow, logical component, and implementation to device definition and instance, with verification, validation, and evidence attached — a many-to-many graph, not a pipeline.</desc>
  <defs><marker id="tbarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker>
  <marker id="tbarrowg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0a8d76"/></marker></defs>
  <rect width="1240" height="620" rx="24" fill="#fbfcfd"/>

  <text x="48" y="52" font-family="Nunito,Arial,sans-serif" font-size="20" font-weight="850" fill="#082744">THE TRACEABILITY BACKBONE</text>
  <text x="48" y="79" font-family="Nunito,Arial,sans-serif" font-size="14" fill="#5c7188">Clinical intent to postmarket evidence. Every arrow is a typed relationship; any element may join several paths.</text>

  <!-- Row 1: operational world (purple) -->
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle" font-size="12" font-weight="800">
    <rect x="48" y="120" width="176" height="58" rx="12" fill="#f0edff" stroke="#8971dc" stroke-width="2"/><text x="136" y="145" fill="#4c3a98">MedicalUseCase</text><text x="136" y="164" font-size="10.5" font-weight="600" fill="#5c7188">the user's goal</text>
    <rect x="286" y="120" width="188" height="58" rx="12" fill="#f0edff" stroke="#8971dc" stroke-width="2"/><text x="380" y="145" fill="#4c3a98">OperationalWorkflow</text><text x="380" y="164" font-size="10.5" font-weight="600" fill="#5c7188">how the work is organized</text>
    <rect x="536" y="120" width="188" height="58" rx="12" fill="#f0edff" stroke="#8971dc" stroke-width="2"/><text x="630" y="145" fill="#4c3a98">OperationalScenario</text><text x="630" y="164" font-size="10.5" font-weight="600" fill="#5c7188">a selected path</text>
    <rect x="786" y="120" width="188" height="58" rx="12" fill="#f0edff" stroke="#8971dc" stroke-width="2"/><text x="880" y="145" fill="#4c3a98">OperationalActivity</text><text x="880" y="164" font-size="10.5" font-weight="600" fill="#5c7188">work + user tasks</text>
    <rect x="1036" y="120" width="156" height="58" rx="12" fill="#f0edff" stroke="#8971dc" stroke-width="2"/><text x="1114" y="145" fill="#4c3a98">UsesProduct</text><text x="1114" y="164" font-size="10.5" font-weight="600" fill="#5c7188">instruments by role</text>
  </g>

  <!-- Row 2: functional + logical -->
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle" font-size="12" font-weight="800">
    <rect x="98" y="240" width="176" height="58" rx="12" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/><text x="186" y="265" fill="#17557f">SystemFunction</text><text x="186" y="284" font-size="10.5" font-weight="600" fill="#5c7188">technology-independent</text>
    <rect x="336" y="240" width="176" height="58" rx="12" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/><text x="424" y="265" fill="#17557f">FunctionalFlow</text><text x="424" y="284" font-size="10.5" font-weight="600" fill="#5c7188">functions organized</text>
    <rect x="574" y="240" width="188" height="58" rx="12" fill="#e3faf3" stroke="#2dd4a8" stroke-width="2"/><text x="668" y="265" fill="#07604f">LogicalComponent</text><text x="668" y="284" font-size="10.5" font-weight="600" fill="#5c7188">channels · interfaces</text>
  </g>

  <!-- Row 2 right: implementation stack -->
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle" font-size="11.5" font-weight="800">
    <rect x="812" y="222" width="150" height="38" rx="10" fill="#fff3e8" stroke="#ef9b51" stroke-width="2"/><text x="887" y="246" fill="#88501f">Software realization</text>
    <rect x="828" y="252" width="150" height="38" rx="10" fill="#fff3e8" stroke="#ef9b51" stroke-width="2"/><text x="903" y="276" fill="#88501f">Hardware realization</text>
    <rect x="844" y="282" width="150" height="38" rx="10" fill="#fff3e8" stroke="#ef9b51" stroke-width="2"/><text x="919" y="306" fill="#88501f">Physical realization</text>
  </g>

  <!-- Row 3: product identity + clinical use -->
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle" font-size="12" font-weight="800">
    <rect x="98" y="380" width="220" height="58" rx="12" fill="#eef4f7" stroke="#5c7188" stroke-width="2"/><text x="208" y="405" fill="#082744">MedicalDeviceDefinition</text><text x="208" y="424" font-size="10.5" font-weight="600" fill="#5c7188">catalog identity · UDI-DI</text>
    <rect x="380" y="380" width="212" height="58" rx="12" fill="#eef4f7" stroke="#5c7188" stroke-width="2"/><text x="486" y="405" fill="#082744">MedicalDeviceInstance</text><text x="486" y="424" font-size="10.5" font-weight="600" fill="#5c7188">serial · lot · UDI-PI · history</text>
    <rect x="654" y="380" width="196" height="58" rx="12" fill="#f0edff" stroke="#8971dc" stroke-width="2"/><text x="752" y="405" fill="#4c3a98">ClinicalProcedure use</text><text x="752" y="424" font-size="10.5" font-weight="600" fill="#5c7188">occurrences in care</text>
  </g>

  <!-- Row 3 right: V&V + evidence -->
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle" font-size="12" font-weight="800">
    <rect x="912" y="380" width="132" height="58" rx="12" fill="#e3faf3" stroke="#0a8d76" stroke-width="2"/><text x="978" y="405" fill="#07604f">V &amp; V</text><text x="978" y="424" font-size="10.5" font-weight="600" fill="#5c7188">cases + scenarios</text>
    <rect x="1076" y="380" width="120" height="58" rx="12" fill="#0b1e2d"/><text x="1136" y="405" fill="#2dd4a8">Evidence</text><text x="1136" y="424" font-size="10.5" font-weight="600" fill="#9fb4c6">+ postmarket</text>
  </g>

  <!-- arrows row1 -->
  <g stroke="#5c7188" stroke-width="2.2" fill="none" marker-end="url(#tbarrow)">
    <path d="M224 149 H282"/><path d="M474 149 H532"/><path d="M724 149 H782"/><path d="M974 149 H1032"/>
  </g>
  <!-- row1 -> row2 -->
  <g stroke="#5c7188" stroke-width="2.2" fill="none" marker-end="url(#tbarrow)">
    <path d="M862 178 C 700 214 400 210 230 240"/>
    <path d="M186 298 C 186 320 320 356 200 380" opacity="0"/>
  </g>
  <g stroke="#5c7188" stroke-width="2.2" fill="none" marker-end="url(#tbarrow)">
    <path d="M274 269 H332"/><path d="M512 269 H570"/><path d="M762 258 H808"/>
  </g>
  <!-- implementation -> definition -->
  <g stroke="#5c7188" stroke-width="2.2" fill="none" marker-end="url(#tbarrow)">
    <path d="M900 322 C 780 372 480 360 320 388"/>
    <path d="M318 409 H376"/><path d="M592 409 H650"/>
  </g>
  <!-- assurance arrows -->
  <g stroke="#0a8d76" stroke-width="2.2" fill="none" marker-end="url(#tbarrowg)">
    <path d="M850 409 H908"/>
    <path d="M1046 409 H1072"/>
    <path d="M978 378 C 978 330 968 320 962 322" opacity="0"/>
  </g>
  <g stroke="#0a8d76" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#tbarrowg)">
    <path d="M966 378 C 940 350 940 340 930 322"/>
    <path d="M990 378 C 1030 300 800 200 728 178"/>
  </g>
  <g font-family="Nunito,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#0a8d76">
    <text x="1000" y="340">verifies</text>
    <text x="1002" y="248">validates use case &amp; critical tasks</text>
  </g>

  <!-- relationship labels -->
  <g font-family="Nunito,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#5c7188" text-anchor="middle">
    <text x="253" y="141">supports</text>
    <text x="503" y="141">selects path</text>
    <text x="753" y="141">comprises</text>
    <text x="1003" y="141">by role</text>
    <text x="530" y="212">enables ↑ · SystemFunction enablesActivity</text>
    <text x="303" y="261">includes</text>
    <text x="541" y="261">allocatedTo</text>
    <text x="785" y="250">realizes</text>
    <text x="560" y="352">realizedBy · device realization</text>
    <text x="347" y="401">instanceOf</text>
    <text x="621" y="401">used in</text>
    <text x="879" y="401">produces</text>
  </g>

  <g font-family="Nunito,Arial,sans-serif">
    <rect x="48" y="500" width="1148" height="76" rx="14" fill="#eef4f7" stroke="#d8e2e9"/>
    <text x="72" y="530" font-size="13" font-weight="850" fill="#082744">A GRAPH, NOT A PIPELINE</text>
    <text x="72" y="554" font-size="12" fill="#5c7188">A function may be realized by human action or mechanics instead of software. A forceps model jumps from activity straight to physical part. Every hop is optional; every trace is typed and reviewable in both directions.</text>
  </g>
</svg>
