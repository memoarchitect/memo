<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 605" width="860" height="605" font-family="Nunito, 'Segoe UI', Arial, sans-serif" role="img" aria-label="MEMO's five architecture layers, the question each answers, and the link that carries the work from each layer to the next">
<defs>
  <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="38" font-size="13" font-weight="800" letter-spacing="1.2" fill="#2f6fc4">UNDERSTANDING THE NEED</text>
  <line x1="243.2" y1="34" x2="840" y2="34" stroke="#2f6fc4" stroke-width="1" opacity="0.5"/>
  <rect x="20" y="50" width="820" height="62" rx="12" fill="#e8f1fc" stroke="#2f6fc4" stroke-width="1.5"/>
  <rect x="20" y="50" width="7" height="62" rx="3" fill="#2f6fc4"/>
  <text x="42" y="89" font-size="21" font-weight="800" fill="#123b6b">Operational</text>
  <text x="230" y="88" font-size="16" font-style="italic" fill="#2c4f7a">Why does the device exist, for whom, in what setting?</text>
  <line x1="80" y1="116" x2="80" y2="151" stroke="#e07a1f" stroke-width="3" marker-end="url(#orange)"/>
  <text x="100" y="139" font-size="15.5" fill="#1f2a37">OperativeAction  <tspan font-style="italic" font-weight="700" fill="#b25a0c">perform</tspan>  SystemFunction</text>
  <rect x="20" y="155" width="820" height="62" rx="12" fill="#e8f1fc" stroke="#2f6fc4" stroke-width="1.5"/>
  <rect x="20" y="155" width="7" height="62" rx="3" fill="#2f6fc4"/>
  <text x="42" y="194" font-size="21" font-weight="800" fill="#123b6b">Functional</text>
  <text x="230" y="193" font-size="16" font-style="italic" fill="#2c4f7a">What must the system do?</text>
  <line x1="80" y1="221" x2="80" y2="256" stroke="#e07a1f" stroke-width="3" marker-end="url(#orange)"/>
  <text x="100" y="244" font-size="15.5" fill="#1f2a37">ComponentFunction  <tspan font-style="italic" font-weight="700" fill="#b25a0c">allocate</tspan>  LogicalComponent</text>
  <text x="20" y="278" font-size="13" font-weight="800" letter-spacing="1.2" fill="#2f6fc4">DESIGNING THE SOLUTION</text>
  <line x1="243.2" y1="274" x2="840" y2="274" stroke="#2f6fc4" stroke-width="1" opacity="0.5"/>
  <rect x="20" y="290" width="820" height="62" rx="12" fill="#e8f1fc" stroke="#2f6fc4" stroke-width="1.5"/>
  <rect x="20" y="290" width="7" height="62" rx="3" fill="#2f6fc4"/>
  <text x="42" y="329" font-size="21" font-weight="800" fill="#123b6b">Logical</text>
  <text x="230" y="328" font-size="16" font-style="italic" fill="#2c4f7a">How is the solution organised, before choosing a technology?</text>
  <line x1="80" y1="356" x2="80" y2="391" stroke="#e07a1f" stroke-width="3" marker-end="url(#orange)"/>
  <text x="100" y="379" font-size="15.5" fill="#1f2a37">LogicalComponent  <tspan font-weight="800" fill="#b25a0c">RealizedBy</tspan>  SoftwareSystem or HardwareAssembly</text>
  <rect x="20" y="395" width="820" height="62" rx="12" fill="#e8f1fc" stroke="#2f6fc4" stroke-width="1.5"/>
  <rect x="20" y="395" width="7" height="62" rx="3" fill="#2f6fc4"/>
  <text x="42" y="434" font-size="21" font-weight="800" fill="#123b6b">Implementation</text>
  <text x="230" y="433" font-size="16" font-style="italic" fill="#2c4f7a">What is it built from?</text>
  <line x1="80" y1="461" x2="80" y2="519" stroke="#e07a1f" stroke-width="3" marker-end="url(#orange)"/>
  <text x="100" y="484" font-size="15.5" fill="#1f2a37">SoftwareModule  <tspan font-weight="800" fill="#b25a0c">BuildsInto</tspan>  SoftwareDeploymentUnit</text>
  <text x="100" y="507" font-size="15.5" fill="#1f2a37">SoftwareComponent  <tspan font-weight="800" fill="#b25a0c">MemoryBinding</tspan>  MemoryDevice</text>
  <rect x="20" y="523" width="820" height="62" rx="12" fill="#e8f1fc" stroke="#2f6fc4" stroke-width="1.5"/>
  <rect x="20" y="523" width="7" height="62" rx="3" fill="#2f6fc4"/>
  <text x="42" y="562" font-size="21" font-weight="800" fill="#123b6b">Realization</text>
  <text x="230" y="561" font-size="16" font-style="italic" fill="#2c4f7a">Where does it run, and how do its parts reach each other?</text>
</svg>
