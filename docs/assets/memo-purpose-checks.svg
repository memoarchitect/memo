<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
  <title id="title">MEMO supports completeness checking and change-impact analysis</title>
  <desc id="desc">The left panel shows a complete engineering path from clinical intent through function, architecture, control, verification, and evidence. The right panel shows a changed function connected to affected requirements, architecture, risk controls, verification cases, and evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0c2b49" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#138f7a"/>
    </marker>
    <style>
      .title{font:800 24px Nunito,Arial,sans-serif;letter-spacing:2px;fill:#138f7a}
      .panel-title{font:800 27px Nunito,Arial,sans-serif;fill:#0c2b49}
      .panel-sub{font:600 17px Nunito,Arial,sans-serif;fill:#5c6f82}
      .label{font:800 13px Nunito,Arial,sans-serif;fill:#0c2b49;text-anchor:middle}
      .small{font:650 11px Nunito,Arial,sans-serif;fill:#5c6f82;text-anchor:middle}
      .pill{font:800 16px Nunito,Arial,sans-serif;fill:#138f7a;text-anchor:middle}
      .edge{fill:none;stroke:#138f7a;stroke-width:3;marker-end:url(#arrow)}
      .impact-edge{fill:none;stroke:#7f91a4;stroke-width:2.7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="608" rx="28" fill="#f8fafc" stroke="#d7e3eb" stroke-width="2"/>
  <text x="55" y="52" class="title">WHAT THE PROJECT MODEL ENABLES</text>

  <g filter="url(#shadow)">
    <rect x="50" y="82" width="635" height="475" rx="24" fill="#ffffff" stroke="#cfe0e8" stroke-width="2"/>
    <rect x="715" y="82" width="635" height="475" rx="24" fill="#ffffff" stroke="#cfe0e8" stroke-width="2"/>
  </g>

  <text x="82" y="130" class="panel-title">Completeness checking</text>
  <text x="82" y="159" class="panel-sub">Evaluate whether every required engineering path closes.</text>

  <path class="edge" d="M151 285 H208"/>
  <path class="edge" d="M264 285 H321"/>
  <path class="edge" d="M389 285 H405"/>
  <path class="edge" d="M485 285 H500"/>
  <path class="edge" d="M580 285 H595"/>

  <g>
    <circle cx="123" cy="285" r="40" fill="#e1f6f2" stroke="#58c5b4" stroke-width="2"/>
    <path d="M105 285l11 11 24-27" fill="none" stroke="#138f7a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="123" y="349" class="label">Clinical intent</text>
    <text x="123" y="371" class="small">need · scenario</text>
  </g>
  <g>
    <circle cx="236" cy="285" r="40" fill="#e8f2fb" stroke="#7db8e8" stroke-width="2"/>
    <path d="M218 285l11 11 24-27" fill="none" stroke="#2f83c9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="236" y="349" class="label">Function</text>
    <text x="236" y="371" class="small">required behavior</text>
  </g>
  <g>
    <circle cx="349" cy="285" r="40" fill="#eeeafd" stroke="#aa97e7" stroke-width="2"/>
    <path d="M331 285l11 11 24-27" fill="none" stroke="#8069ce" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="349" y="349" class="label">Architecture</text>
    <text x="349" y="371" class="small">responsibility</text>
  </g>
  <g>
    <circle cx="445" cy="285" r="40" fill="#fff0e3" stroke="#f1b27a" stroke-width="2"/>
    <path d="M427 285l11 11 24-27" fill="none" stroke="#e88331" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="445" y="349" class="label">Risk control</text>
    <text x="445" y="371" class="small">implemented</text>
  </g>
  <g>
    <circle cx="540" cy="285" r="40" fill="#e1f6f2" stroke="#58c5b4" stroke-width="2"/>
    <path d="M522 285l11 11 24-27" fill="none" stroke="#138f7a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="349" class="label">Verification</text>
    <text x="540" y="371" class="small">case executed</text>
  </g>
  <g>
    <circle cx="635" cy="285" r="40" fill="#e8f2fb" stroke="#7db8e8" stroke-width="2"/>
    <path d="M617 285l11 11 24-27" fill="none" stroke="#2f83c9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="635" y="349" class="label">Evidence</text>
    <text x="635" y="371" class="small">current baseline</text>
  </g>

  <rect x="171" y="430" width="392" height="54" rx="27" fill="#e1f6f2" stroke="#7bd0c2"/>
  <text x="367" y="464" class="pill">Required path present and type-correct</text>

  <text x="747" y="130" class="panel-title">Change-impact analysis</text>
  <text x="747" y="159" class="panel-sub">Traverse typed relationships to define the review scope.</text>

  <path class="impact-edge" d="M1031 286 C971 244 929 226 876 221"/>
  <path class="impact-edge" d="M1031 286 C970 286 922 286 866 286"/>
  <path class="impact-edge" d="M1031 286 C971 330 929 350 876 355"/>
  <path class="impact-edge" d="M1099 286 C1145 243 1175 226 1210 221"/>
  <path class="impact-edge" d="M1099 286 C1145 286 1175 286 1210 286"/>
  <path class="impact-edge" d="M1099 286 C1145 330 1175 350 1210 355"/>

  <g>
    <circle cx="1065" cy="286" r="66" fill="#0c2b49"/>
    <circle cx="1065" cy="286" r="52" fill="#138f7a"/>
    <path d="M1046 286h38M1065 267v38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="1065" y="379" class="label">Changed element</text>
    <text x="1065" y="401" class="small">scenario · function · component</text>
  </g>

  <g>
    <rect x="760" y="191" width="116" height="60" rx="14" fill="#e8f2fb" stroke="#7db8e8"/>
    <text x="818" y="217" class="label">Requirements</text>
    <text x="818" y="237" class="small">rationale</text>
  </g>
  <g>
    <rect x="750" y="256" width="116" height="60" rx="14" fill="#eeeafd" stroke="#aa97e7"/>
    <text x="808" y="282" class="label">Architecture</text>
    <text x="808" y="302" class="small">allocation</text>
  </g>
  <g>
    <rect x="760" y="325" width="116" height="60" rx="14" fill="#fff0e3" stroke="#f1b27a"/>
    <text x="818" y="351" class="label">Risk controls</text>
    <text x="818" y="371" class="small">effectiveness</text>
  </g>

  <g>
    <rect x="1210" y="191" width="120" height="60" rx="14" fill="#e8f2fb" stroke="#7db8e8"/>
    <text x="1270" y="217" class="label">Interfaces</text>
    <text x="1270" y="237" class="small">contracts</text>
  </g>
  <g>
    <rect x="1210" y="256" width="120" height="60" rx="14" fill="#e1f6f2" stroke="#58c5b4"/>
    <text x="1270" y="282" class="label">V&amp;V</text>
    <text x="1270" y="302" class="small">re-run</text>
  </g>
  <g>
    <rect x="1210" y="325" width="120" height="60" rx="14" fill="#e1f6f2" stroke="#58c5b4"/>
    <text x="1270" y="351" class="label">Evidence</text>
    <text x="1270" y="371" class="small">baseline</text>
  </g>

  <rect x="875" y="446" width="380" height="54" rx="27" fill="#e8f2fb" stroke="#9bc8ec"/>
  <text x="1065" y="480" class="pill">Affected elements define the review scope</text>
</svg>
