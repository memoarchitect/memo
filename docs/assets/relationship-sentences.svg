<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
  <title id="title">Relationships read as reviewable sentences</title>
  <desc id="desc">Five ontology-valid relationship sentences connect a need to a use case, a functional flow to a system function and logical component, and a system function to verification evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#082744" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1160" height="420" rx="24" fill="#fbfcfd"/>
  <g font-family="Nunito,Arial,sans-serif">
    <text x="48" y="50" font-size="23" font-weight="850" fill="#082744">RELATIONSHIPS STATE ENGINEERING CLAIMS</text>
    <text x="48" y="78" font-size="16" fill="#5c7188">Each arrow uses the relationship direction and endpoint types declared by MEMO.</text>
  </g>

  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)" font-size="15" font-weight="850">
    <rect x="55" y="132" width="140" height="58" rx="12" fill="#f2edff" stroke="#8971dc" stroke-width="2"/>
    <text x="125" y="166" fill="#4a3896">Need</text>
    <rect x="275" y="132" width="140" height="58" rx="12" fill="#f2edff" stroke="#8971dc" stroke-width="2"/>
    <text x="345" y="166" fill="#4a3896">UseCase</text>

    <rect x="495" y="132" width="140" height="58" rx="12" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/>
    <text x="565" y="166" fill="#17557f">FunctionalFlow</text>
    <rect x="715" y="132" width="140" height="58" rx="12" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/>
    <text x="785" y="166" fill="#17557f">SystemFunction</text>
    <rect x="935" y="132" width="170" height="58" rx="12" fill="#e3faf3" stroke="#2dd4a8" stroke-width="2"/>
    <text x="1020" y="166" fill="#07604f">LogicalComponent</text>

    <rect x="275" y="278" width="140" height="58" rx="12" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/>
    <text x="345" y="312" fill="#17557f">SystemFunction</text>
    <rect x="552" y="278" width="170" height="58" rx="12" fill="#e3faf3" stroke="#2dd4a8" stroke-width="2"/>
    <text x="637" y="312" fill="#07604f">VerificationCase</text>
    <rect x="875" y="278" width="170" height="58" rx="12" fill="#0b1e2d" stroke="#0b1e2d" stroke-width="2"/>
    <text x="960" y="312" fill="#2dd4a8">Evidence</text>
  </g>

  <g fill="none" stroke="#5c7188" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M205 161H265"/>
    <path d="M645 161H705"/>
    <path d="M865 161H925"/>
    <path d="M425 307H542"/>
    <path d="M732 307H865"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="800" fill="#526b84" text-anchor="middle">
    <text x="235" y="116">Motivates</text>
    <text x="675" y="116">InvolvesFunction</text>
    <text x="895" y="116">AllocatedTo</text>
    <text x="484" y="292">VerifiedBy</text>
    <text x="798" y="292">ProducesEvidence</text>
  </g>
  <g font-family="Nunito,Arial,sans-serif" font-size="14" font-weight="700" fill="#526b84">
    <text x="55" y="218">Operational rationale</text>
    <text x="495" y="218">Functional responsibility and allocation</text>
    <text x="275" y="364">Verification and evidence</text>
  </g>
</svg>
