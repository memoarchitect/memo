<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
  <title id="title">Relationships read as reviewable sentences</title>
  <desc id="desc">A visual trace from a need through use case, function, component, requirement, verification case, and evidence using typed relationship labels.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker></defs>
  <rect width="1160" height="420" rx="24" fill="#fbfcfd"/>
  <g font-family="Nunito,Arial,sans-serif"><text x="48" y="52" font-size="20" font-weight="850" fill="#082744">RELATIONSHIPS MAKE REVIEWABLE SENTENCES</text><text x="48" y="78" font-size="14" fill="#5c7188">The arrow label says exactly how two facts are connected. Follow it in either direction during review.</text></g>
  <g font-family="Nunito,Arial,sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="850"><rect x="55" y="150" width="140" height="58" rx="12" fill="#f2edff" stroke="#8971dc" stroke-width="2"/><text x="125" y="174" fill="#4a3896">Need</text><text x="125" y="193" fill="#5c7188" font-size="11" font-weight="600">Clinician warning</text><rect x="275" y="150" width="140" height="58" rx="12" fill="#f2edff" stroke="#8971dc" stroke-width="2"/><text x="345" y="174" fill="#4a3896">Use case</text><text x="345" y="193" fill="#5c7188" font-size="11" font-weight="600">Monitor temperature</text><rect x="495" y="150" width="140" height="58" rx="12" fill="#eaf4fd" stroke="#438ed0" stroke-width="2"/><text x="565" y="174" fill="#17557f">Function</text><text x="565" y="193" fill="#5c7188" font-size="11" font-weight="600">Detect deviation</text><rect x="715" y="150" width="140" height="58" rx="12" fill="#e3faf3" stroke="#2dd4a8" stroke-width="2"/><text x="785" y="174" fill="#07604f">Component</text><text x="785" y="193" fill="#5c7188" font-size="11" font-weight="600">Alarm controller</text><rect x="935" y="150" width="170" height="58" rx="12" fill="#fff0ef" stroke="#ea6b61" stroke-width="2"/><text x="1020" y="174" fill="#94423d">Verification case</text><text x="1020" y="193" fill="#5c7188" font-size="11" font-weight="600">High-temperature test</text></g>
    <g stroke="#5c7188" stroke-width="2" marker-end="url(#arrow)"><path d="M197 179H271"/><path d="M417 179H491"/><path d="M637 179H711"/><path d="M857 179H931"/><path d="M1020 210V290"/></g>
    <g font-size="11.5" font-weight="850" fill="#5c7188"><text x="235" y="165">Motivates</text><text x="455" y="165">Enables</text><text x="675" y="165">AllocatedTo</text><text x="894" y="165">VerifiedBy</text></g>
    <rect x="930" y="292" width="180" height="58" rx="12" fill="#e3faf3" stroke="#2dd4a8" stroke-width="2"/><text x="1020" y="316" font-size="13" font-weight="850" fill="#07604f">Evidence</text><text x="1020" y="335" font-size="11" font-weight="600" fill="#5c7188">Test report</text><text x="1020" y="274" font-size="11.5" font-weight="850" fill="#5c7188">ProducesEvidence</text>
  </g>
</svg>
