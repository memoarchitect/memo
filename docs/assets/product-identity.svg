<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="pititle pidesc">
  <title id="pititle">Medical product identity: definition, instance, role</title>
  <desc id="pidesc">A device definition carries catalog identity and the reuse lifecycle; manufactured instances carry serial, lot, and history; activities use the product through a role-typed relationship.</desc>
  <defs><marker id="piarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker></defs>
  <rect width="1160" height="560" rx="24" fill="#fbfcfd"/>

  <text x="48" y="52" font-family="Nunito,Arial,sans-serif" font-size="20" font-weight="850" fill="#082744">PRODUCT IDENTITY: DEFINITION · INSTANCE · ROLE</text>
  <text x="48" y="79" font-family="Nunito,Arial,sans-serif" font-size="14" fill="#5c7188">FHIR-aligned split: catalog identity on the definition, production identity on the instance, and "tool" as a role — never a duplicate element.</text>

  <!-- definition card -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="48" y="116" width="360" height="270" rx="16" fill="#eef4f7" stroke="#5c7188" stroke-width="2"/>
    <rect x="48" y="116" width="360" height="46" rx="16" fill="#0b1e2d"/>
    <text x="72" y="145" font-size="13" font-weight="850" fill="#2dd4a8">MedicalDeviceDefinition</text>
    <g font-size="12" fill="#082744">
      <text x="72" y="192" font-weight="800">Mayo-Hegar Needle Holder MH-15</text>
      <text x="72" y="216">manufacturer · model · catalog number</text>
      <text x="72" y="238">UDI-DI  <tspan font-weight="700" fill="#0a8d76">(01)04012345000061</tspan></text>
      <text x="72" y="260">codes · GMDN 35674 · intended purpose</text>
    </g>
    <g font-size="11" font-weight="750">
      <rect x="72" y="276" width="100" height="24" rx="12" fill="#e3faf3" stroke="#2dd4a8"/><text x="122" y="292" fill="#07604f" text-anchor="middle">mechanical</text>
      <text x="186" y="292" fill="#5c7188" font-weight="600">technology domains (multivalued)</text>
    </g>
    <g font-size="11.5" fill="#5c7188">
      <rect x="72" y="312" width="312" height="54" rx="10" fill="#ffffff" stroke="#d8e2e9"/>
      <text x="86" y="332" font-weight="800" fill="#082744">ReuseLifecycle</text>
      <text x="86" y="352">reusable · reprocess + autoclave · max 500 uses</text>
    </g>
  </g>

  <!-- instance cards -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="540" y="150" width="330" height="120" rx="14" fill="#ffffff" stroke="#d8e2e9" stroke-width="2" transform="translate(14,-14)"/>
    <rect x="540" y="150" width="330" height="120" rx="14" fill="#ffffff" stroke="#d8e2e9" stroke-width="2" transform="translate(7,-7)"/>
    <rect x="540" y="150" width="330" height="120" rx="14" fill="#ffffff" stroke="#5c7188" stroke-width="2"/>
    <text x="562" y="180" font-size="13" font-weight="850" fill="#082744">MedicalDeviceInstance · SN-000042</text>
    <g font-size="11.5" fill="#5c7188">
      <text x="562" y="204">lot LOT-2025-11 · manufactured 2025-11-14</text>
      <text x="562" y="224">UDI-PI on the instance — never on the definition</text>
      <text x="562" y="244" font-weight="750" fill="#0a8d76">37 autoclave cycles · last inspection passed</text>
    </g>
  </g>

  <!-- role usage card -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="540" y="330" width="572" height="120" rx="14" fill="#f0edff" stroke="#8971dc" stroke-width="2"/>
    <text x="562" y="360" font-size="13" font-weight="850" fill="#4c3a98">UserTask · PlaceSutures — uses the product through a role</text>
    <g font-size="11.5" fill="#5c7188">
      <text x="562" y="384">TaskUsesProduct: role = <tspan font-weight="800" fill="#4c3a98">primaryInstrument</tspan> · required · qty 1 · sterile required</text>
      <text x="562" y="404">Difficulty belongs to the task in context (TaskDifficultyAssessment) — never to the instrument.</text>
      <text x="562" y="424" font-weight="750" fill="#94423d">The same product is one element: "tool" is the role it plays in the activity.</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#5c7188" stroke-width="2.2" fill="none" marker-end="url(#piarrow)">
    <path d="M410 210 H536"/>
    <path d="M410 330 C 460 350 490 370 536 384"/>
  </g>
  <g font-family="Nunito,Arial,sans-serif" font-size="11" font-weight="750" fill="#5c7188">
    <text x="440" y="200">instanceOf ⁻¹</text>
    <text x="430" y="342">used by role</text>
  </g>

  <!-- invariant strip -->
  <g font-family="Nunito,Arial,sans-serif">
    <rect x="48" y="478" width="1064" height="52" rx="14" fill="#fff0ef" stroke="#ea6b61" stroke-width="1.6"/>
    <text x="72" y="500" font-size="12" font-weight="850" fill="#94423d">CHECKED INVARIANTS</text>
    <text x="72" y="519" font-size="11.5" fill="#94423d">instance must reference a definition · no serial/lot on definitions · single-use products cannot carry a reprocessing lifecycle · patient-contact parts declare contact nature and duration</text>
  </g>
</svg>
