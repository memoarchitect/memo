<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">Choosing an element type</title>
  <desc id="desc">A visual guide that maps the kind of fact being recorded to a MEMO element type.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7188"/></marker></defs>
  <rect width="1160" height="430" rx="24" fill="#fbfcfd"/>
  <g font-family="Nunito,Arial,sans-serif"><text x="48" y="52" font-size="20" font-weight="850" fill="#082744">CHOOSE THE ELEMENT THAT MATCHES THE FACT</text><text x="48" y="78" font-size="14" fill="#5c7188">Ask what you are recording, then use the element type on the right.</text></g>
  <g font-family="Nunito,Arial,sans-serif" font-size="14"><text x="70" y="115" font-weight="850" fill="#5c7188">YOU ARE RECORDING</text><text x="750" y="115" font-weight="850" fill="#5c7188">USE THIS ELEMENT</text></g>
  <g font-family="Nunito,Arial,sans-serif">
    <g fill="#ffffff" stroke="#d8e2e9" stroke-width="1.5">
      <rect x="50" y="130" width="440" height="42" rx="10"/><rect x="50" y="182" width="440" height="42" rx="10"/><rect x="50" y="234" width="440" height="42" rx="10"/><rect x="50" y="286" width="440" height="42" rx="10"/><rect x="50" y="338" width="440" height="42" rx="10"/>
    </g>
    <g font-size="15" fill="#082744"><text x="72" y="157">A person or external system that interacts</text><text x="72" y="209">A user need or a testable obligation</text><text x="72" y="261">Work the system must perform</text><text x="72" y="313">A responsibility or implemented part</text><text x="72" y="365">A hazard, control, test, or result</text></g>
    <g stroke="#5c7188" stroke-width="2" marker-end="url(#arrow)"><path d="M505 151H680"/><path d="M505 203H680"/><path d="M505 255H680"/><path d="M505 307H680"/><path d="M505 359H680"/></g>
    <g font-size="14" font-weight="800" text-anchor="middle"><rect x="710" y="130" width="390" height="42" rx="10" fill="#eaf4fd" stroke="#438ed0" stroke-width="1.5"/><text x="905" y="157" fill="#17557f">Actor, User, or NonHumanActor</text><rect x="710" y="182" width="390" height="42" rx="10" fill="#f2edff" stroke="#8971dc" stroke-width="1.5"/><text x="905" y="209" fill="#4a3896">StakeholderNeed or SystemRequirement</text><rect x="710" y="234" width="390" height="42" rx="10" fill="#eaf4fd" stroke="#438ed0" stroke-width="1.5"/><text x="905" y="261" fill="#17557f">SystemFunction</text><rect x="710" y="286" width="390" height="42" rx="10" fill="#e3faf3" stroke="#2dd4a8" stroke-width="1.5"/><text x="905" y="313" fill="#07604f">LogicalComponent, SoftwareItem, or part</text><rect x="710" y="338" width="390" height="42" rx="10" fill="#fff0ef" stroke="#ea6b61" stroke-width="1.5"/><text x="905" y="365" fill="#94423d">Hazard, RiskControl, VerificationCase, or Evidence</text></g>
  </g>
</svg>
